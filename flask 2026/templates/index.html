<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand bg-body-tertiary" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('hello_world') }}">My Todo</a>
            <ul class="navbar-nav flex-row flex-wrap me-auto mb-0">
                <li class="nav-item">
                    <a class="nav-link active small" aria-current="page" href="{{ url_for('hello_world') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link small" href="{{ url_for('about') }}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link small" href="{{ url_for('products') }}">Products</a>
                </li>
                <li class="nav-item dropdown">
                    <button class="nav-link dropdown-toggle small" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        More
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{{ url_for('hello_world') }}">Home</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('about') }}">About</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('products') }}">Products</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="container mt-5" style="max-width: 450px;">
            <div class="card shadow-sm p-4">
                <h3 class="card-title text-center mb-4">Login</h3>

                <form action="/login" method="POST">
                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="userEmail" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="userEmail" name="email"
                            placeholder="name@example.com" required>
                        <div class="form-text">We'll never share your email with anyone else.</div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <label for="userPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="userPassword" name="password"
                            placeholder="Enter your password" required>
                    </div>

                    <!-- Checkbox (Optional) -->
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                </form>
            </div>
        </div>
    </div>
    <div class="container">
        <h2>your todo list</h2>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">S.NO</th>
                    <th scope="col">First</th>
                    <th scope="col">Last</th>
                    <th scope="col">Handle</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Mark</td>
                    <td>Otto</td>
                    <td>@mdo</td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>Jacob</td>
                    <td>Thornton</td>
                    <td>@fat</td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td>John</td>
                    <td>Doe</td>
                    <td>@social</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
