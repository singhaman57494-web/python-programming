<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand bg-body-tertiary" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('hello_world') }}">My Todo</a>
            <ul class="navbar-nav flex-row flex-wrap me-auto mb-0">
                <li class="nav-item">
                    <a class="nav-link active small" aria-current="page" href="{{ url_for('hello_world') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link small" href="{{ url_for('about') }}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link small" href="{{ url_for('products') }}">Products</a>
                </li>
                <li class="nav-item dropdown">
                    <button class="nav-link dropdown-toggle small" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        More
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{{ url_for('hello_world') }}">Home</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('about') }}">About</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('products') }}">Products</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="container mt-5" style="max-width: 450px;">
            <div class="card shadow-sm p-4">
                <h3 class="card-title text-center mb-4">Login</h3>

                <form action="/" method="POST">
                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="title" class="form-label">Todo Title</label>
                        <input type="text" class="form-control" name="title" id="title" area-describedby="emailhelp">
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <label for="desc" class="form-label">Todo description</label>
                        <input type="text" class="form-control" name="desc" id="desc" </div>

                        <!-- Checkbox (Optional) -->
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100">Submit</button>
                </form>
            </div>
        </div>
    </div>
    <div class="container">
        <h2>your todo list</h2>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">S.NO</th>
                    <th scope="col">Title</th>
                    <th scope="col">Description</th>
                    <th scope="col">Time</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for todo in allTodo %}
                <tr>
                    <th scope="row">{{loop.index}}</th>
                    <td>{{todo.title}}</td>
                    <td>{{todo.desc}}</td>
                    <td>{{todo.date_created}}</td>
                    <td><a href="delete/{{todo.sno}}" type="button" class="btn btn-outline-dark btn-sn mx-1">Update</button>
                            <a href="delete/{{todo.sno}}" type="button" class="btn btn-outline-dark btn-sn mx-1">Delete</button>
                    </td>
                </tr>
                {% endfor %}


            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
