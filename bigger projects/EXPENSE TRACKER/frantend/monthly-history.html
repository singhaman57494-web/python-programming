
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly History | Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="monthly-history.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Expense Tracker</a>

        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="monthly-history.html" class="active">Monthly History</a>
            <a href="edit-transactions.html">Transactions</a>
            <a href="notification.html">Notifications</a>
        </div>
    </nav>

    <main class="monthly-history-container">
        <header class="history-header">
            <div>
                <h1>Monthly History</h1>
                <p>View your daily income and expenses.</p>
            </div>
        </header>

        <section class="month-navigation">
            <button id="prevMonth" type="button">← Previous</button>
            <h2 id="currentMonth">Loading...</h2>
            <button id="nextMonth" type="button">Next →</button>
        </section>

        <section class="monthly-summary">
            <div class="summary-card">
                <h3>Total Income</h3>
                <p id="monthlyIncome">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="monthlyExpenses">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Net Balance</h3>
                <p id="monthlyBalance">₹0</p>
            </div>
        </section>

        <section class="calendar-section">
            <div class="calendar-grid" id="calendarGrid">
                <!-- Calendar dates will be generated by JavaScript -->
            </div>
        </section>
    </main>

    <script src="monthly-history.js"></script>
</body>
</html>
