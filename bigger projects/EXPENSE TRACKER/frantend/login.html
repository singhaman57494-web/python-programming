<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ExpenseTracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-container">
        <h1>Expense<span>Tracker</span></h1>
        <p class="auth-subtitle">Welcome back! Please login.</p>

        <form id="login-form">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <p id="login-message"></p>

        <p class="auth-switch">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>
    </div>

    <script>
        const API_URL =
            window.location.hostname === "localhost" ||
                window.location.hostname === "127.0.0.1"
                ? "http://127.0.0.1:5000"
                : "https://python-programming-1-8ew8.onrender.com";

        document.getElementById("login-form").addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("login-message");

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                message.textContent = result.message || result.error;
                message.style.color = response.ok ? "green" : "red";
                if (response.ok) {
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                }

            } catch (error) {
                message.textContent = "Server connection failed. Please try again.";
                message.style.color = "red";
            }
        });
    </script>

</body>

</html>
