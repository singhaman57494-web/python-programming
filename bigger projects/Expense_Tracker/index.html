<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Expense Tracker</h1>
        <p>Manage your money smartly.</p>
    </header>

    <main>
        <section class="add-expense">
            <h2>Add New Expense</h2>

            <form id="expense-form">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>

                <label for="category">Category</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="dashboard">
            <div class="card">
                <h3>Total Balance</h3>
                <p id="balance">₹0.00</p>
            </div>

            <div class="card">
                <h3>Total Income</h3>
                <p id="income">₹0.00</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenses">₹0.00</p>
            </div>
        </section>

        <section class="add-income">
            <h2>Add New Income</h2>
            <form id="income-form">
                <label for="income-amount">Amount (₹)</label>
                <input type="number" id="income-amount" placeholder="Enter income amount" min="0.01" step="0.01"
                    required>
                <label for="income-category">Income Category</label>
                <select id="income-category" required>
                    <option value="Salary">Salary</option>
                    <option value="Pocket Money">Pocket Money</option>
                    <option value="Gift">Gift</option>
                    <option value="Other Income">Other Income</option>
                </select>
                <button type="submit">Add Income</button>
            </form>
        </section>

        <section class="transactions">
            <h2>Recent Transactions</h2>
            <label for="search-transaction">Search Transactions:</label>
            <input type="text" id="search-transaction" placeholder="Search Food, Travel, Shopping...">
            <label for="filter-category">Filter Transactions:</label>
            <select id="filter-category">
                <option value="All">All Transactions</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Salary">Salary</option>
                <option value="Pocket Money">Pocket Money</option>
                <option value="Gift">Gift</option>
                <option value="Other Income">Other Income</option>
                <option value="Other">Other</option>
            </select>

            <p>Your transactions will appear here.</p>
        </section>
        <section class="charts-container">
            <div class="chart-section">
                <h2>Income by Category</h2>
                <canvas id="income-chart"></canvas>
            </div>

            <div class="chart-section">
                <h2>Expenses by Category</h2>
                <canvas id="expense-chart"></canvas>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
